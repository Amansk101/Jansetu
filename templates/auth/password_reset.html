{% extends 'base.html' %}{% block title %}Reset password · JanSutra AI{% endblock %}{% block content %}
<main class="auth-wrap"><div class="auth-card">
  <span class="eyebrow">ACCOUNT RECOVERY</span>
  <h1>Reset your password</h1>
  <p>Enter the email address registered on your account and we will send a secure reset link.</p>
  <form method="post">
    {% csrf_token %}
    <label class="form-label">Email address</label>
    <input class="form-control mb-4" type="email" name="email" required>
    <button class="btn btn-primary w-100 btn-lg">Send reset link <i class="bi bi-arrow-right ms-2"></i></button>
  </form>
  <p class="account-footnote mt-3">Remembered it? <a href="{% url 'login' %}">Back to sign in</a></p>
</div></main>
{% endblock %}
