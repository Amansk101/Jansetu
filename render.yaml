# Render Blueprint for JanSutra AI (Django + PostgreSQL).
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# NOTE: Render allows only one active free-tier PostgreSQL database per account.
# This project therefore does NOT create its own database here. Set DATABASE_URL
# in the service's Environment tab (Render Postgres / Neon / Supabase connection
# string). Until DATABASE_URL is set, the app falls back to SQLite, which lives on
# the service's ephemeral disk and is reset on every deploy.
services:
  - type: web
    name: jansutra-ai
    runtime: python
    plan: free
    region: singapore
    # 'bash build.sh' (not './build.sh') so the script runs even when the
    # executable bit is not preserved by the Git client on Windows.
    buildCommand: 'bash build.sh'
    startCommand: 'gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120'
    envVars:
      - key: PYTHON_VERSION
        value: '3.13.4'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: 'false'
      - key: DJANGO_ALLOWED_HOSTS
        value: '.onrender.com'
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: 'https://*.onrender.com'
      - key: REQUIRE_EMAIL_VERIFICATION
        value: 'false'
      - key: WEB_CONCURRENCY
        value: '2'
      # --- Administrator / District Collector account (created during build) ---
      - key: COLLECTOR_USERNAME
        value: admin
      - key: COLLECTOR_EMAIL
        value: armaan.sk113@gmail.com
      - key: COLLECTOR_PASSWORD
        sync: false
      # --- AI Citizen Assistant (leave the key blank to use FAQ-only answers) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: 'gemini-flash-latest,gemini-3.1-flash-lite'
      - key: GEMINI_TIMEOUT
        value: '3'
      # --- Outgoing email (certificates, status updates) ---
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: '587'
      - key: EMAIL_USE_TLS
        value: 'true'
      - key: EMAIL_HOST_USER
        value: armaan.sk113@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: 'JanSutra AI <armaan.sk113@gmail.com>'
